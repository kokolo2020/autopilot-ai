    else if (t < 13) { if (stopped.length) bubbleText(stopped[0].c + ' hit its stop. Boom.' + (stopped[0].resets ? ' Reborn at ' + stopped[0].lev + 'x.' : ''), 280, 70, 520); else if (worst) bubbleText('ALERT: ' + worst.l.c + ' is ' + Math.round(worst.pg * 100) + '% of the way to its stop!', 230, 70, 620); else bubbleText(tot >= 0 ? 'So far so good.' : 'Some coins did not read the plan.', 300, 70, 420); }
    /* fee gremlin takes a bite */
    var feeTot = LEGS.reduce(function (s, l) { return s + l.n * FEE * 2; }, 0), fee = t > 12 ? feeTot * seg(t, 12, 14.5) : 0;
    if (t > 11.5 && t < 20) { var gx = 360 + (1 - seg(t, 11.5, 12.5)) * 700, gy = 480 + Math.sin(t * 8) * 4; x.fillStyle = '#7e57c2'; x.beginPath(); x.arc(gx, gy, 28, 0, 7); x.fill(); x.fillStyle = '#fff'; x.beginPath(); x.arc(gx - 9, gy - 6, 6, 0, 7); x.arc(gx + 9, gy - 6, 6, 0, 7); x.fill(); x.fillStyle = '#111'; x.beginPath(); x.arc(gx - 9, gy - 5, 3, 0, 7); x.arc(gx + 9, gy - 5, 3, 0, 7); x.fill(); x.fillRect(gx - 12, gy + 6, 24, 5); x.fillStyle = txt; x.font = '700 18px system-ui'; x.fillText('fees nibble ' + money(-fee), gx + 38, gy + 6); }
    /* scoreboard */
    var net = tot - fee; x.font = '800 54px ui-monospace,monospace'; x.fillStyle = net < -0.005 ? '#ff6b6b' : net > 0.005 ? '#3ddc97' : txt; x.textAlign = 'center'; x.fillText(money(net), W / 2, 640); x.font = '600 18px system-ui'; x.fillStyle = mut; x.fillText(t > 14.5 ? 'batch total after fees' : t > 9 ? 'batch total before fees' : 'batch total', W / 2, 668); x.textAlign = 'left';
    if (t > 16 && t < 21.8) bubbleText(net < 0 ? 'Closing bell at 8pm. Anything can happen.' : 'Closing bell at 8pm. Nobody touch anything.', 220, 110, 640);
    if (!paused && !reduce) requestAnimationFrame(frame);
  }
  document.getElementById('re').onclick = function () { t0 = performance.now(); paused = false; off = 0; document.getElementById('sp').textContent = 'Pause'; requestAnimationFrame(frame); };
  document.getElementById('sp').onclick = function () { paused = !paused; this.textContent = paused ? 'Play' : 'Pause'; if (!paused) { t0 = performance.now() - off * 1000; requestAnimationFrame(frame); } };
  if (reduce) { off = 17; paused = true; document.getElementById('sp').textContent = 'Play'; }
  chips(); setText(); load(); requestAnimationFrame(frame);
})();
