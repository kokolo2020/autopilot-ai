  }
  function days() { var s = {}; ALL.forEach(function (r) { if (+r.trades_closed > 0) s[r.day] = 1; }); return Object.keys(s).sort().reverse().slice(0, 8); }
  get('ap_daily_snapshots', 'select=day,desk,desk_name,pnl,fees,trades_closed,win_rate,cum_pnl,cum_fees,cum_trades&order=day.desc&limit=1000').then(function (r) {
    ALL = r; var ds = days(); if (!ds.length) { $('body').innerHTML = '<div class="card">No daily snapshots yet. They fill in every 30 minutes once the daily function has run.</div>'; return; }
    day = ds[0]; render();
  }).catch(function (e) { $('body').innerHTML = '<div class="card down">Could not load the daily snapshots: ' + esc(e.message) + '</div>'; });
})();
</script>
</body>
