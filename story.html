<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autopilot Short Story</title>
<style>
  :root { --bg:#0b0f14; --card:#121922; --line:#1f2a37; --text:#e6edf3; --mut:#8b98a8; --acc:#6aa9ff; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg:#f4f6f9; --card:#fff; --line:#dde3ea; --text:#17202b; --mut:#5b6b7d; --acc:#2c6fd6; } }
  * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  .wrap { max-width:820px; margin:0 auto; padding:16px; } h1 { font-size:18px; margin:0 0 4px; letter-spacing:.05em; } .sub { color:var(--mut); font-size:12px; margin-bottom:12px; } a { color:var(--acc); }
  canvas { width:100%; height:auto; display:block; border:1px solid var(--line); border-radius:16px; background:var(--card); }
  .row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; align-items:center; } .row button { font:600 13px system-ui; border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:999px; padding:6px 14px; cursor:pointer; }
  .fine { color:var(--mut); font-size:12px; margin-top:12px; line-height:1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>TWO TRUE STORIES <small style="color:var(--mut);font-weight:500;font-size:12px;letter-spacing:0">· a true story from batch 1 · <a href="/arena.html">Tide Room</a> · <a href="/batch.html">Batch tracker</a></small></h1>
  <div class="sub">Two real trades from Neutral Rev batch 1, acted out. Pick a story. Paper money.</div>
  <canvas id="c" width="1000" height="600" aria-label="Animation of a short trade on BNB that moves against the bear"></canvas>
  <div class="row"><button id="s1" type="button" style="border-color:var(--acc)">The bear (short BNB)</button><button id="s2" type="button">The bull (long FIL)</button><button id="re" type="button">Replay</button><button id="sp" type="button">Pause</button></div>
  <div class="fine" id="fine"></div>
</div>
<script>
(function () {
  var cv = document.getElementById('c'), x = cv.getContext('2d'), W = 1000, H = 600;
  var FEE = 0.00055, NOTIONAL = 500, SCENES = {
    bear: { dir: -1, coin: 'BNB', entry: 720.1, now: 721.4, dec: 1, fine: 'The numbers are real: short BNB at 720.1, price now 721.4, $500 position (5x on $100). The price moved against the short by +0.18%: about -$0.90 before fees and -$1.45 after both fees, if it closed right now. The batch does not close until 20:00 Bangkok, so the story is not over.' },
    bull: { dir: 1, coin: 'FIL', entry: 1.0543, now: 1.0483, dec: 4, fine: 'The numbers are real: long FIL at 1.0543, price now 1.0483, $500 position (5x on $100). The price moved against the long by -0.57%: about -$2.85 before fees and -$3.40 after both fees, if it closed right now. The batch does not close until 20:00 Bangkok, so the story is not over.' } };
  var SC = SCENES.bear, ENTRY = SC.entry, NOW = SC.now, gross = 0, net = 0;
  function setScene(k) { SC = SCENES[k]; ENTRY = SC.entry; NOW = SC.now; gross = SC.dir * NOTIONAL * (NOW - ENTRY) / ENTRY; net = gross - NOTIONAL * FEE * 2; document.getElementById('fine').textContent = SC.fine; document.getElementById('s1').style.borderColor = k === 'bear' ? 'var(--acc)' : 'var(--line)'; document.getElementById('s2').style.borderColor = k === 'bull' ? 'var(--acc)' : 'var(--line)'; t0 = performance.now(); off = 0; if (paused) { paused = false; document.getElementById('sp').textContent = 'Pause'; } requestAnimationFrame(frame); }
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t0 = performance.now(), paused = false, off = 0, LOOP = 16;
  var css = function (v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); };
  var ease = function (a) { a = Math.max(0, Math.min(1, a)); return a * a * (3 - 2 * a); };
  var seg = function (t, a, b) { return ease((t - a) / (b - a)); };
  var money = function (n) { return (n < 0 ? '-' : '+') + '$' + Math.abs(n).toFixed(2); };

  function bear(cx, cy, mood, sweat, t) {
    var bull = SC.dir > 0; /* mood 0 smug .. 1 panic */
    var bob = Math.sin(t * 2) * 2, y = cy + bob;
    if (bull) { x.fillStyle = '#efe6d8'; x.strokeStyle = '#8a7b66'; x.lineWidth = 3;[-1, 1].forEach(function (d) { x.beginPath(); x.moveTo(cx + d * 40, cy - 40); x.quadraticCurveTo(cx + d * 100, cy - 60, cx + d * 82, cy - 118); x.quadraticCurveTo(cx + d * 66, cy - 80, cx + d * 40, cy - 56); x.closePath(); x.fill(); x.stroke(); }); }
    x.fillStyle = bull ? '#4a4f5c' : '#a0683c'; [[-52, -62], [52, -62]].forEach(function (e) { x.beginPath(); x.arc(cx + e[0], y + e[1], 20, 0, 7); x.fill(); });
    x.fillStyle = '#e8b98a'; [[-52, -62], [52, -62]].forEach(function (e) { x.beginPath(); x.arc(cx + e[0], y + e[1], 10, 0, 7); x.fill(); });
    x.fillStyle = bull ? '#5d6370' : '#b8794a'; x.beginPath(); x.ellipse(cx, y + 78, 62, 70, 0, 0, 7); x.fill(); /* body */
    x.fillStyle = '#e8b98a'; x.beginPath(); x.ellipse(cx, y + 90, 36, 44, 0, 0, 7); x.fill();
    x.fillStyle = bull ? '#5d6370' : '#b8794a'; x.beginPath(); x.arc(cx, y, 66, 0, 7); x.fill(); /* head */
    x.fillStyle = '#e8b98a'; x.beginPath(); x.ellipse(cx, y + 20, 30, 24, 0, 0, 7); x.fill();
    x.fillStyle = '#2b1d14'; x.beginPath(); x.ellipse(cx, y + 10, 9, 6, 0, 0, 7); x.fill(); if (bull) { x.strokeStyle = '#f3ba2f'; x.lineWidth = 4; x.beginPath(); x.arc(cx, y + 30, 11, 0, Math.PI); x.stroke(); }
    var er = 8 + mood * 6, ey = y - 14, blink = Math.sin(t * 1.3) > 0.97 ? 0.2 : 1;
    [-24, 24].forEach(function (dx) { x.fillStyle = '#fff'; x.beginPath(); x.ellipse(cx + dx, ey, er + 4, (er + 4) * blink, 0, 0, 7); x.fill(); x.fillStyle = '#1a1a1a'; x.beginPath(); x.arc(cx + dx + (1 - mood) * 3, ey + mood * 2, Math.max(2, 5 - mood * 2), 0, 7); x.fill(); });
    x.strokeStyle = '#2b1d14'; x.lineWidth = 4; x.lineCap = 'round'; x.beginPath();
    if (mood < 0.35) { x.arc(cx, y + 28, 16, 0.15 * Math.PI, 0.85 * Math.PI); } /* smirk */
    else { x.moveTo(cx - 14, y + 38 - mood * 4); x.quadraticCurveTo(cx, y + 30 + mood * 6, cx + 14, y + 38 - mood * 4); } x.stroke();
    x.beginPath(); x.moveTo(cx - 40, ey - 18 - mood * 6); x.lineTo(cx - 12, ey - 24 + (mood > 0.5 ? 8 : 0)); x.moveTo(cx + 40, ey - 18 - mood * 6); x.lineTo(cx + 12, ey - 24 + (mood > 0.5 ? 8 : 0)); x.stroke();
    for (var i = 0; i < Math.round(sweat * 4); i++) { var sy = ((t * 90 + i * 40) % 90); x.fillStyle = '#6aa9ff'; x.globalAlpha = 1 - sy / 90; x.beginPath(); x.ellipse(cx + 70 + (i % 2) * 14, y - 40 + sy, 5, 8, 0, 0, 7); x.fill(); x.globalAlpha = 1; }
  }
  function coin(cx, cy, r, glasses, t) {
    x.fillStyle = '#f3ba2f'; x.beginPath(); x.arc(cx, cy, r, 0, 7); x.fill(); x.strokeStyle = '#b8860b'; x.lineWidth = 5; x.stroke();
    x.fillStyle = '#b8860b'; x.font = '800 ' + Math.round(r * 0.5) + 'px ui-monospace,monospace'; x.textAlign = 'center'; x.fillText(SC.coin, cx, cy + r * 0.62); x.textAlign = 'left';
    if (glasses) { x.fillStyle = '#111'; x.fillRect(cx - r * 0.7, cy - r * 0.4, r * 0.55, r * 0.28); x.fillRect(cx + r * 0.15, cy - r * 0.4, r * 0.55, r * 0.28); x.fillRect(cx - r * 0.2, cy - r * 0.34, r * 0.4, 4); x.strokeStyle = '#111'; x.lineWidth = 4; x.beginPath(); x.arc(cx, cy + r * 0.05, r * 0.3, 0.1 * Math.PI, 0.9 * Math.PI); x.stroke(); }
  }
  function balloon(bx, by, col, t, k) { x.strokeStyle = '#8b98a8'; x.lineWidth = 2; x.beginPath(); x.moveTo(bx, by + 30); x.lineTo(bx + Math.sin(t * 2 + k) * 6, by + 85); x.stroke(); x.fillStyle = col; x.beginPath(); x.ellipse(bx, by, 22, 28, 0, 0, 7); x.fill(); x.fillStyle = 'rgba(255,255,255,.35)'; x.beginPath(); x.ellipse(bx - 7, by - 9, 5, 8, 0, 0, 7); x.fill(); }
  function bubbleText(txt, bx, by, w) { x.font = '700 22px system-ui'; var tw = Math.min(w, x.measureText(txt).width + 28); x.fillStyle = '#fff'; x.strokeStyle = '#111'; x.lineWidth = 3; x.beginPath(); x.roundRect ? x.roundRect(bx, by, tw, 44, 14) : x.rect(bx, by, tw, 44); x.fill(); x.stroke(); x.fillStyle = '#111'; x.fillText(txt, bx + 14, by + 30); }

  function frame(ts) {
    var t = paused ? off : ((ts - t0) / 1000 + 0) % LOOP; if (!paused) off = t; var txt = css('--text'), mut = css('--mut'), line = css('--line');
    x.clearRect(0, 0, W, H);
    var sky = x.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, 'rgba(106,169,255,.10)'); sky.addColorStop(1, 'rgba(106,169,255,0)'); x.fillStyle = sky; x.fillRect(0, 0, W, H);
    /* price ruler on the right */
    var up = SC.dir < 0, yE = up ? 430 : 330, move = 150 * seg(t, 3, 8.5), yN = up ? yE - move : yE + move; /* a short loses when the coin rises, a long when it falls */
    x.strokeStyle = mut; x.lineWidth = 2; x.setLineDash([8, 7]); x.beginPath(); x.moveTo(60, yE); x.lineTo(940, yE); x.stroke(); x.setLineDash([]);
    x.fillStyle = mut; x.font = '600 20px ui-monospace,monospace'; x.fillText('entry ' + ENTRY, 70, yE + 26);
    var price = ENTRY + (NOW - ENTRY) * seg(t, 3, 8.5); x.fillStyle = txt; x.font = '700 30px ui-monospace,monospace'; x.fillText(SC.coin + ' ' + price.toFixed(SC.dec), 700, 60);
    /* the bear stays on the entry line holding a SHORT sign */
    var mood = 0.05 + 0.9 * seg(t, 4, 8.5), sweat = seg(t, 5, 8);
    bear(230, yE - 175, mood, sweat, t);
    x.fillStyle = up ? '#c93c3c' : '#13875a'; x.fillRect(90, yE - 62, 150, 54); x.fillStyle = '#fff'; x.font = '800 20px ui-monospace,monospace'; x.fillText(up ? 'SHORT' : 'BUY THE DIP', up ? 124 : 98, yE - 40); x.fillText(String(ENTRY), 128, yE - 16); x.fillStyle = '#7a5230'; x.fillRect(166, yE - 8, 8, 40);
    /* the coin, carried up by balloons */
    var cx = 640, cy = yN - 40; var lift = seg(t, 3, 8.5); if (t < 3) cy = yE - 40 + Math.sin(t * 2) * 3;
    if (up && (lift > 0 || t > 3)) { balloon(cx - 50, cy - 100 - lift * 6, '#ff6b6b', t, 0); balloon(cx, cy - 125, '#3ddc97', t, 1); balloon(cx + 50, cy - 100 + lift * 6, '#6aa9ff', t, 2); }
    if (!up) { cy = yN + 55; if (t < 3) cy = yE + 55 + Math.sin(t * 2) * 3; cy = Math.min(cy, 500); for (var sp = 0; sp < 4; sp++) { x.strokeStyle = mut; x.globalAlpha = 0.5; x.lineWidth = 3; x.beginPath(); x.moveTo(cx - 36 + sp * 24, cy - 120 - sp * 10); x.lineTo(cx - 36 + sp * 24, cy - 70); x.stroke(); x.globalAlpha = 1; } x.fillStyle = '#555c6b'; x.fillRect(cx - 40, cy - 70, 80, 14); x.fillStyle = '#fff'; x.font = '800 16px ui-monospace,monospace'; x.fillText('DIP', cx - 18, cy - 59); }
    coin(cx, cy, 52, t > 5.5, t);
    if (t > 6.5 && t < 11.5) bubbleText(up ? 'Hello, bear.' : 'Hello, bull.', cx + 70, cy - 70, 240);
    if (t > 3.2 && t < 6.4) bubbleText(up ? 'Going down, right?' : 'It\u2019s a dip! Buy!', up ? 40 : 330, up ? 70 : 90, 330);
    /* P&L counter */
    var g = gross * seg(t, 3, 8.5), n = t > 9.5 ? gross + (net - gross) * seg(t, 9.5, 11) : g;
    x.font = '800 54px ui-monospace,monospace'; x.fillStyle = n < -0.005 ? '#ff6b6b' : txt; x.fillText(money(n), 40, 560); x.font = '600 18px system-ui'; x.fillStyle = mut; x.fillText(t > 9.5 ? 'after both fees' : (up ? 'bear’s P&L' : 'bull’s P&L'), 290, 560);
    /* fee gremlin */
    if (t > 9 && t < 14.5) { var gx = 560 + (1 - seg(t, 9, 10)) * 500, gy = 520 + Math.sin(t * 8) * 4; x.fillStyle = '#7e57c2'; x.beginPath(); x.arc(gx, gy, 26, 0, 7); x.fill(); x.fillStyle = '#fff'; x.beginPath(); x.arc(gx - 9, gy - 6, 6, 0, 7); x.arc(gx + 9, gy - 6, 6, 0, 7); x.fill(); x.fillStyle = '#111'; x.beginPath(); x.arc(gx - 9, gy - 5, 3, 0, 7); x.arc(gx + 9, gy - 5, 3, 0, 7); x.fill(); x.fillRect(gx - 12, gy + 6, 24, 5); x.fillStyle = txt; x.font = '700 18px system-ui'; x.fillText('fees: 0.055% each way', gx + 36, gy + 6); }
    if (t > 12 && t < 15.8) { bubbleText(up ? '6 hours to the 8pm bell...' : 'The dip has no bottom...', 330, 140, 420); }
    if (reduce) { /* reduced motion: hold the final scene */ }
    if (!paused && !reduce) requestAnimationFrame(frame);
  }
  document.getElementById('s1').onclick = function () { setScene('bear'); }; document.getElementById('s2').onclick = function () { setScene('bull'); };
  document.getElementById('re').onclick = function () { t0 = performance.now(); paused = false; off = 0; document.getElementById('sp').textContent = 'Pause'; requestAnimationFrame(frame); };
  document.getElementById('sp').onclick = function () { paused = !paused; this.textContent = paused ? 'Play' : 'Pause'; if (!paused) { t0 = performance.now() - off * 1000; requestAnimationFrame(frame); } };
  if (reduce) { off = 11; paused = true; document.getElementById('sp').textContent = 'Play'; }
  setScene('bear');
})();
</script>
</body>
</html>
